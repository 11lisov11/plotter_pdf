[pytest]
addopts = -m "not hardware_required and not word_required and not kompas_required"
testpaths = tests
cache_dir = _tmp/pytest_cache
markers =
    word_required: tests requiring Microsoft Word COM automation or Word installation.
    kompas_required: tests requiring KOMPAS/CAD conversion tooling.
    hardware_required: tests requiring a physical GRBL plotter connection.

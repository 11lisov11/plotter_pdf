[pytest]
addopts = -m "not hardware_required and not word_required and not kompas_required and not build"
testpaths = tests
markers =
    word_required: tests requiring Microsoft Word COM automation or Word installation.
    kompas_required: tests requiring KOMPAS/CAD conversion tooling.
    hardware_required: tests requiring a physical GRBL plotter connection.
    gui: GUI tests, may require PySide6/offscreen Qt.
    slow: slow tests.
    build: packaging/build smoke tests.

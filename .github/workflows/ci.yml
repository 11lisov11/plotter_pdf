name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,photo]"
      - name: Ruff
        run: ruff check src plotter_studio plotter_app tests scripts
      - name: Pytest
        run: python -m pytest -q -m "not hardware_required and not word_required and not kompas_required and not build"
      - name: Coverage
        run: |
          python -m coverage run -m pytest -q -m "not hardware_required and not word_required and not kompas_required and not build"
          python -m coverage report -m --fail-under=55
          python -m coverage xml -o coverage.xml
      - name: GUI tests
        run: python -m pytest -q -m "gui and not hardware_required"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Upload failed artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-artifacts-${{ matrix.python-version }}
          path: |
            .pytest_cache
            _plotter_jobs

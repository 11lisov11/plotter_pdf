name: CI

on:
  push:
    branches:
      - main
      - master
      - production/gui-binaries-tests
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,photo]"

      - name: Ruff
        run: ruff check src plotter_studio plotter_app tests scripts

      - name: Pytest
        run: python -m pytest -q -m "not hardware_required and not word_required and not kompas_required and not build"

      - name: Coverage
        run: |
          python -m coverage run -m pytest -q -m "not hardware_required and not word_required and not kompas_required and not build"
          python -m coverage report -m --fail-under=55
          python -m coverage xml -o coverage.xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload failed test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-artifacts-${{ matrix.python-version }}
          path: |
            _tmp/**
            .pytest_cache/**
          if-no-files-found: ignore

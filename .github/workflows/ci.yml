name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff coverage

      - name: Run ruff
        run: ruff check src plotter_studio tests

  tests:
    name: Tests (unittest + pytest)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run pytest suite
        run: python -m pytest -q

  coverage-report:
    name: Coverage (pytest)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest coverage

      - name: Run coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report -m --include "src/*,plotter_studio/*" --fail-under=32
          python -m coverage xml -o coverage.xml

